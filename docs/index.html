  bg: hx(t.bg), dim: hx(t.dim), lit: hx(t.lit), alt: hx(t.alt), hot: hx(t.hot)
}));
const mix3 = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
const rgba = (c, a) => "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + a + ")";
const THEME_FADE = 1.15; // seconds for the full palette crossfade
let themeIdx = 0, fadeFrom = null, fadeStart = -10, tablesDirty = true;

function currentColors(t) {
  const target = TC[themeIdx];
  if (!fadeFrom) return target;
  let f = (t - fadeStart) / THEME_FADE;
  f = f < 0 ? 0 : f > 1 ? 1 : f;
  f = f * f * (3 - 2 * f); // smoothstep — ease in/out, no hard snaps
  return { dim: mix3(fadeFrom.dim, target.dim, f), lit: mix3(fadeFrom.lit, target.lit, f), alt: mix3(fadeFrom.alt, target.alt, f), hot: mix3(fadeFrom.hot, target.hot, f) };
}

const maxR = Math.hypot(DOT_W * PITCH, DOT_H * PITCH) / 2 + 80;

/* dot lists rebuilt on demand */
let raised = [];

function buildDots() {
  raised = [];
  const ox = (PAD + DOT_W * PITCH / 2);
  const oy = (PAD + DOT_H * PITCH / 2);
  for (let r = 0; r < LINES.length; r++) {
    const line = LINES[r];
    for (let c = 0; c < line.length; c++) {
      const bits = (line.charCodeAt(c) - 0x2800) & 0xff;
      for (const [dy, dx, bit] of DOT_BITS) {
        const x = PAD + c * PITCH * 2 + dx * PITCH + PITCH / 2;
        const y = PAD + r * PITCH * 4 + dy * PITCH + PITCH / 2;
        const dxo = x - ox, dyo = y - oy;
        const dist = Math.hypot(dxo, dyo);
        const dot = { x, y, dist, ux: dist > 0 ? dxo / dist : 1, uy: dist > 0 ? dyo / dist : 0, _p: 0, _g: 0 };
        if (bits & bit) raised.push(dot);
      }
    }
  }
}

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = DOT_W * PITCH + PAD * 2;
  const H = DOT_H * PITCH + PAD * 2;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.aspectRatio = W + " / " + H;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ── precomputed tables — zero string building per frame ── */

function lerp3raw(t, a, b, c) {
  t = Math.max(0, Math.min(1.15, t));
  let u, v0, v1;
  if (t <= 0.55) { u = t / 0.55; v0 = a; v1 = b; } else { u = (t - 0.55) / 0.6; v0 = b; v1 = c; }
  return "rgb(" + Math.round(v0[0] + (v1[0] - v0[0]) * u) + "," + Math.round(v0[1] + (v1[1] - v0[1]) * u) + "," + Math.round(v0[2] + (v1[2] - v0[2]) * u) + ")";
}
function buildTables(pal) {
  dimColor = [];
  for (let i = 0; i < LEVELS; i++) {
    dimColor.push(lerp3raw((i / (LEVELS - 1)) * 1.15, pal.dim, pal.lit, pal.hot));
  }
  glowSprite = document.createElement("canvas");
  glowSprite.width = glowSprite.height = 64;
  const g = glowSprite.getContext("2d");
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, rgba(pal.hot, 1));
  grad.addColorStop(0.28, rgba(pal.lit, 0.55));
  grad.addColorStop(0.62, rgba(pal.alt, 0.3));
  grad.addColorStop(1, rgba(pal.alt, 0));
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
}
const dimBuckets  = Array.from({ length: LEVELS }, () => []);
const glowJobs = [];

/* ═══ PER-THEME DOT GEOMETRY ═════════════════════════════════════════ */
function drawDotShape(shape, x, y, s) {
  const h = s * 0.5, r = s * 0.55;
  switch (shape) {
    case "circle":
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); break;
    case "ring":
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.lineWidth = Math.max(1.1, s * 0.3); ctx.stroke(); break;
    case "diamond":
      ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); ctx.fill(); break;
    case "plus": {
      const t = s * 0.34;
      ctx.fillRect(x - h, y - t / 2, s, t);
      ctx.fillRect(x - t / 2, y - h, t, s);
      break;
    }
    default: // square
      ctx.fillRect(x - h, y - h, s, s);
  }
}

/* ═══ AMBIENT FX PARTICLES (transparent, no background) ══════════════ */
let lastParticleT = 0;
const KATAKANA = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF";
let particles = [];
function newParticle(fx, W, H, scatter) {
  const R = Math.random;
  switch (fx) {
    case "snow":     return { x: R() * W, y: scatter ? R() * H : -10 - R() * 40, vy: 26 + R() * 46, vx: (R() - 0.5) * 16, r: 1.1 + R() * 2.1, ph: R() * 6.28 };
    case "embers":   return { x: R() * W, y: scatter ? R() * H : H + 6 + R() * 30, vy: -(34 + R() * 76), vx: (R() - 0.5) * 18, r: 0.8 + R() * 1.8, ph: R() * 6.28 };
    case "rain":     return { x: R() * (W + 240) - 120, y: scatter ? R() * H : -20 - R() * H * 0.4, vy: 480 + R() * 260, vx: -50, len: 9 + R() * 14, o: 0.16 + R() * 0.3 };
    case "katakana": return { x: R() * W, y: scatter ? R() * H : -20 - R() * H * 0.5, vy: 150 + R() * 200, ch: KATAKANA[(R() * KATAKANA.length) | 0], o: 0.35 + R() * 0.6, sz: 9 + R() * 8 };
    case "stars":    return { x: R() * W, y: R() * H, r: 0.6 + R() * 1.6, ph: R() * 6.28, sp: 0.7 + R() * 2.4 };
    case "petals":   return { x: R() * W, y: scatter ? R() * H : -14 - R() * 40, vy: 22 + R() * 32, ph: R() * 6.28, r: 1.9 + R() * 2.3, rot: R() * 6.28, vr: (R() - 0.5) * 2.2 };
    case "motes":    return { x: R() * W, y: R() * H, vy: (R() - 0.5) * 11, vx: (R() - 0.5) * 11, r: 0.7 + R() * 1.6, ph: R() * 6.28 };
    case "sparks":   return { x: R() * W, y: H * (0.55 + R() * 0.45), vy: -(80 + R() * 150), vx: (R() - 0.5) * 40, r: 0.7 + R() * 1.6, ph: R() * 6.28, age: R() * 0.9, life: 0.9 + R() * 0.8 };
    default: return null;
  }
}
function drawParticles(pal, t, dt, W, H) {
  const fx = TC[themeIdx].fx;
  if (fx === "none") { particles.length = 0; return; }
  while (particles.length < 56) {
    const p = newParticle(fx, W, H, true);
    if (!p) return;
    particles.push(p);
  }
  const glowFX = fx === "embers" || fx === "sparks";
  if (glowFX) ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    switch (fx) {
      case "snow":
        p.y += p.vy * dt; p.x += (p.vx + Math.sin(t * 1.4 + p.ph) * 9) * dt;
        ctx.fillStyle = rgba(pal.hot, 0.85);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
        if (p.y > H + 6) particles[i] = newParticle(fx, W, H, false);
        break;
      case "embers": {
        p.y += p.vy * dt; p.x += (p.vx + Math.sin(t * 2.1 + p.ph) * 14) * dt;
        const a = 0.45 + 0.45 * Math.sin(t * 8 + p.ph);
        ctx.fillStyle = rgba(pal.lit, Math.max(0.12, a));
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + 0.3 * Math.sin(t * 6 + p.ph)), 0, 6.2832); ctx.fill();
        if (p.y < -8) particles[i] = newParticle(fx, W, H, false);
        break;
      }
      case "rain":
        p.y += p.vy * dt; p.x += p.vx * dt;
        ctx.strokeStyle = rgba(pal.lit, p.o); ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.024, p.y - p.len); ctx.stroke();
        if (p.y > H + 16) particles[i] = newParticle(fx, W, H, false);
        break;
      case "katakana":
        p.y += p.vy * dt;
        ctx.font = p.sz + "px ui-monospace, Consolas, monospace";
        ctx.fillStyle = rgba(pal.lit, p.o);
        ctx.fillText(p.ch, p.x, p.y);
        if (p.y > H + 14) particles[i] = newParticle(fx, W, H, false);
        break;
      case "stars": {
        const tw = Math.pow((Math.sin(t * p.sp + p.ph) + 1) / 2, 2);
        ctx.fillStyle = rgba(pal.hot, 0.12 + 0.78 * tw);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
        break;
      }
      case "petals":
        p.y += p.vy * dt; p.x += Math.sin(t * 1.7 + p.ph) * 22 * dt; p.rot += p.vr * dt;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = rgba(pal.lit, 0.8);
        ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.7, p.r * 0.85, 0, 0, 6.2832); ctx.fill();
        ctx.restore();
        if (p.y > H + 8) particles[i] = newParticle(fx, W, H, false);
        break;
      case "motes":
        p.y += p.vy * dt; p.x += p.vx * dt;
        ctx.fillStyle = rgba(pal.alt, 0.22 + 0.18 * (Math.sin(t * 1.5 + p.ph) * 0.5 + 0.5));
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
        if (p.x < -6) p.x = W + 5; if (p.x > W + 6) p.x = -5;
        if (p.y < -6) p.y = H + 5; if (p.y > H + 6) p.y = -5;
        break;
      case "sparks":
        p.age += dt; p.y += p.vy * dt; p.x += p.vx * dt; p.vy += 150 * dt;
        { const a = Math.max(0, 1 - p.age / p.life);
          ctx.fillStyle = rgba(pal.alt, a);
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill(); }
        if (p.age >= p.life || p.y > H + 10) particles[i] = newParticle(fx, W, H, false);
        break;
    }
  }
  if (glowFX) ctx.globalCompositeOperation = "source-over";
}

/* hidden debug hook: open page with #freeze=SECONDS to inspect a frozen frame */
const freezeMatch = location.hash.match(/freeze=([\d.]+)/);
const freezeAt = freezeMatch ? Math.max(0.31, parseFloat(freezeMatch[1])) : null;

function drawFrame(t) {
  const W = DOT_W * PITCH + PAD * 2;
  const H = DOT_H * PITCH + PAD * 2;

  // palette: smoothstep crossfade toward the active theme (rebuilt only while fading)
  const pal = currentColors(t);
  const fading = fadeFrom !== null && (t - fadeStart) < THEME_FADE;
  if (fading || tablesDirty) { buildTables(pal); tablesDirty = fading; }

  ctx.clearRect(0, 0, W, H);

  const shape = TC[themeIdx].shape;
  const glowMul = TC[themeIdx].glow;
  const pdt = Math.max(0, Math.min(0.05, t - lastParticleT));
  lastParticleT = t;
  drawParticles(pal, t, pdt, W, H);

  // active pulses
  const live = pulses.filter(p => (t - p.t0) > 0);
  const nl = live.length;
  for (const b of dimBuckets) b.length = 0;
  glowJobs.length = 0;

  // pass 1 — raised dots (batched by intensity bucket)
  for (const d of raised) {
    let inten = 0.20 + 0.05 * Math.sin(t * 0.9 + d.y * 0.018 + d.x * 0.004), disp = 0;
    for (let j = 0; j < nl; j++) {
      const p = live[j], age = t - p.t0, r = p.speed * age, x = (d.dist - r) / p.sigma;
      const amp = p.amp * Math.exp(-0.5 * x * x) * Math.exp(-d.dist * 0.0006) * Math.exp(-r * 0.0007);
      inten += amp; disp += amp * 3.4;
    }
    if (inten >= BRIGHT_T) { d._g = Math.min(1, (inten - BRIGHT_T) / 0.75); d._p = disp; glowJobs.push(d); continue; }
    d._p = 0;
    dimBuckets[Math.min(LEVELS - 1, (inten / 1.15 * (LEVELS - 1)) | 0)].push(d);
  }
  for (let i = 0; i < LEVELS; i++) {
    const b = dimBuckets[i];
    if (!b.length) continue;
    ctx.fillStyle = dimColor[i];
    ctx.strokeStyle = dimColor[i];
    const s = (4.2 + i * 0.09) * dotScale;
    for (const d of b) drawDotShape(shape, d.x, d.y, s);
  }

  // pass 2 — bright dots: pre-rendered glow sprites, no shadowBlur anywhere
  ctx.globalCompositeOperation = "lighter";
  for (const d of glowJobs) {
    const g = d._g, size = (15 + 27 * g) * dotScale * glowMul;
    ctx.globalAlpha = 0.45 + 0.55 * g;
    ctx.drawImage(glowSprite, d.x + d.ux * d._p - size / 2, d.y + d.uy * d._p - size / 2, size, size);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";

  // ground-zero detonation bloom (a flash, not a line)
  for (const p of live) {
    const age = t - p.t0;
    if (age >= 0.85) continue;
    const fa = Math.pow(1 - age / 0.85, 2) * 0.85;
    const fr = 26 + age * 300;
    const flash = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, fr);
    flash.addColorStop(0, rgba(pal.hot, fa.toFixed(3)));
    flash.addColorStop(0.35, rgba(pal.lit, (fa * 0.65).toFixed(3)));
    flash.addColorStop(1, rgba(pal.lit, 0));
    ctx.fillStyle = flash;
    ctx.fillRect(0, 0, W, H);
  }

  // alt-accent wirefront — a thin colored shockwave ring riding each pulse
  ctx.globalCompositeOperation = "lighter";
  for (const p of live) {
    const front = p.speed * (t - p.t0);
    const fade = Math.max(0, 1 - front / (maxR + 60));
    if (fade <= 0.02) continue;
    ctx.globalAlpha = fade * 0.6;
    ctx.strokeStyle = rgba(pal.alt, 1);
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(W / 2, H / 2, front, 0, 6.2832); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}


function spawnPulse() {
  pulses.push({ t0: animTime, speed: 235, sigma: 62, amp: 1.3 });
  applyTheme(nextTheme);          // every wave = the next theme (loops 1→35→1)
  nextTheme = (nextTheme + 1) % TC.length;
}

function tick(now) {
  if (!lastFrame) lastFrame = now;
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;

  if (!paused) {
    animTime += dt;
    if (animTime >= nextAuto) {
      spawnPulse();
      nextAuto = animTime + AUTO_INTERVAL;
    }
    // cull dead pulses
    pulses = pulses.filter(p => (animTime - p.t0) * p.speed < maxR + 220);
  }
  drawFrame(animTime);
  requestAnimationFrame(tick);
}

function init() {
  resizeCanvas();
  buildDots();
  buildTables(currentColors(0));
  tablesDirty = false;
  if (freezeAt !== null) {
    paused = true;
    animTime = freezeAt;
    pulses.push({ t0: 0.3, speed: 235, sigma: 62, amp: 1.3 });
    requestAnimationFrame(tick);
    return;
  }
  spawnPulse(); // immediate first blast on load — animation is the point
  requestAnimationFrame(tick);
}

canvas.addEventListener('pointerdown', spawnPulse);

window.addEventListener("resize", () => { resizeCanvas(); drawFrame(animTime); });

init();
</script>
